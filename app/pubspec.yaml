name: astrbot_manager
description: astrbot助手 - 毛玻璃风格 SSH 远程管理 AstrBot 与 NapCat 的手机 App
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  dartssh2: ^3.1.0
  provider: ^6.1.2
  flutter_secure_storage: ^9.2.4
  webview_flutter: ^4.10.0
  image_picker: ^1.1.2
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png
    - assets/services/astrbot.png
    - assets/services/napcat.png
